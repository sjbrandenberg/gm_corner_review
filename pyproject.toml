[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gmcr"
version = "0.1.0"
description = "Learn corner-frequency and accept/reject decisions from human-reviewed gmprocess workspaces"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "h5py", "obspy>=1.4.1", "pandas", "pyarrow", "ucla_plha>=2.1.0", "pyproj", "requests",
                "scikit-learn", "joblib", "matplotlib"]

[project.optional-dependencies]
# LightGBM models (needed when a run recommends one) and the training scripts
ml = ["lightgbm"]

[tool.setuptools]
# gmcr/trained and gmcr/conf hold only data, but Python can import them (as namespace packages), so
# setuptools wants them listed as packages, with their files as their own package data.
packages = ["gmcr", "gmcr.trained", "gmcr.conf"]

[tool.setuptools.package-data]
# trained models exported with scripts/export_models.py (gmcr/trained/<generation>/<name>/)
"gmcr.trained" = ["*/*/*"]
# gmprocess configs of the model generations (gmcr/conf/<generation>/nga.yml)
"gmcr.conf" = ["*/*.yml"]
