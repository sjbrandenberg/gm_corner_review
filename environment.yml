name: gmcr
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy
  - scipy
  - h5py
  - pyproj
  - obspy>=1.4.1
  - pandas
  - pyarrow
  - scikit-learn
  - statsmodels
  - lightgbm
  - joblib
  - requests
  - matplotlib
  - conda-pack
  - paramiko                    # needed by TACC pylauncher
  - pip
  - pip:
      - ucla_plha>=2.1.0          # vectorized point-to-triangle distances
      - globus-cli                # staging batches from DesignSafe (tacc/run_batch.sh)
