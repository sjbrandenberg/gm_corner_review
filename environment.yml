name: gmcr
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy
  - scipy
  - h5py
  - pyproj
  - obspy>=1.4.1
  - pandas
  - pyarrow
  - scikit-learn
  - statsmodels
  - lightgbm
  - joblib
  - requests
  - matplotlib
  - conda-pack
  - paramiko                    # needed by TACC pylauncher
  - pip
  - pip:
      # Pinned for extraction: auto_fchp from 3.0.3 reproduces the review GUI's fchp
      # exactly; 3.1.0 differs slightly on some traces (see README, Notes). pyproject.toml
      # allows 3.x, which is fine for predict.py.
      - ucla_geotech_tools==3.0.3
      - ucla_plha>=2.1.0          # vectorized point-to-triangle distances
      - globus-cli                # staging batches from DesignSafe (tacc/run_batch.sh)
